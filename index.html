<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taj Donat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fbf3f3;--card:#fff;--ink:#2a0d12;--muted:#8a6f73;--line:#f0dcdc;--accent:#c8102e;--accent2:#8f0b21;--soft:#fde8ea;--shadow:0 6px 18px rgba(120,20,35,.08)}
[data-theme=dark]{--bg:#140709;--card:#21100f;--ink:#f6e9ea;--muted:#b79a9d;--line:#3a1d20;--soft:#3a1519;--shadow:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:14px 16px 170px;max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:26px;margin:18px 0 12px}h2{font-size:20px;margin:22px 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#e3283f,#8f0b21);display:grid;place-items:center;color:#fff;font-weight:800}
.brand{font-weight:800;font-size:18px;flex:1}.brand b{color:var(--accent)}
.circle{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.banner{background:linear-gradient(120deg,#2a0508 0%,#6d0a1b 55%,#c8102e 130%);color:#fff;border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.banner small{color:#f0bcc3;font-size:14px}.banner strong{display:block;font-size:38px;margin-top:4px}.banner strong i{font-size:16px;font-style:normal;opacity:.8}
.pill{background:#fff;color:#2a0d12;border:0;border-radius:18px;padding:13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.pill span{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px;box-shadow:var(--shadow);margin-top:12px}
.search span{background:var(--accent);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.search input{flex:1;border:0;background:none;font-size:16px;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;margin:14px 0;overflow-x:auto;padding-bottom:4px}
.chip{display:flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:16px;padding:11px 14px;font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{position:relative;overflow:hidden;border:0;text-align:left;color:#fff;border-radius:24px;min-height:190px;background:linear-gradient(150deg,var(--g1),var(--g2));display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.game .big{position:absolute;top:14px;right:14px;left:14px;text-align:center;font-size:64px;line-height:1;opacity:.95}
.game:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(20,3,6,.85))}
.game>div{position:relative;z-index:1}.game b{font-size:17px;display:block}.game .sub{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:14px;opacity:.9}
.pack{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.pack .ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px}
.pack b{font-size:16px}.pack .pr{color:var(--muted);font-size:14px}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:16px;width:100%;box-shadow:0 8px 18px rgba(200,16,46,.3)}
.btn.sm{padding:11px;font-size:14px;border-radius:12px;margin-top:4px;box-shadow:none}
.btn.dark{background:#5e0a18;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:14px 16px}
.btn.ghost{background:var(--soft);color:var(--accent);box-shadow:none}
.btn.out{background:none;border:1px solid var(--accent);color:var(--accent);box-shadow:none}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.wcard{border-radius:26px;padding:22px;min-height:220px;color:#fff;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.18),transparent 45%),linear-gradient(135deg,#e3283f,#8f0b21);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 28px rgba(200,16,46,.3)}
.wcard .chipic{width:44px;height:32px;border-radius:8px;background:rgba(255,255,255,.55);margin-top:10px}
.wcard small{letter-spacing:.12em;font-size:12px;opacity:.85}.wcard strong{font-size:44px;display:block}.wcard strong i{font-size:18px;font-style:normal}
.field{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:20px;padding:6px 18px;margin:12px 0;background:var(--card)}
.field input{border:0;background:none;font-size:34px;font-weight:800;color:var(--accent2);width:100%;min-width:0;padding:8px 0}
[data-theme=dark] .field input{color:var(--ink)}
.amounts{display:flex;gap:8px}.amounts button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 0;font-weight:800;box-shadow:var(--shadow)}
.amounts button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.check{display:flex;gap:10px;align-items:center;margin:14px 0}.check input{width:24px;height:24px;accent-color:var(--accent)}
.list{padding:4px 16px}.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:16px}
.item:last-child{border-bottom:0}.item .ico{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.item .grow{flex:1}.item .val{color:var(--muted);font-size:14px}
.tag{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;white-space:nowrap}
.idin{width:100%;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;padding:6px 0;color:var(--ink)}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#e3283f,#8f0b21);color:#fff;font-size:30px;font-weight:800;display:grid;place-items:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;background:#ffd45c;color:#5c4200;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;margin-top:6px}
.steps{background:var(--soft);border-radius:18px;padding:14px 14px 14px 32px;margin:12px 0;font-size:15px;line-height:1.5}.steps li{margin-bottom:6px}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;width:100%;background:none;font-weight:700;font-size:16px}
.drop span{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.back{background:none;border:0;color:var(--accent);font-size:16px;font-weight:700;display:flex;align-items:center;gap:4px;padding:6px 0}
.help{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#e3283f,#8f0b21);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(200,16,46,.4)}
.cartbar{position:fixed;left:16px;right:84px;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--card);border-radius:26px;display:flex;justify-content:space-around;padding:10px 4px;box-shadow:0 10px 30px rgba(80,10,20,.18)}
nav button{background:none;border:0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:16px}
nav button.on{color:var(--accent);font-weight:800}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<div id="app"></div>
<div id="cartbar" class="cartbar"></div>
<button class="help" onclick="openTg('https://t.me/'+BOT)" aria-label="Дастгирӣ" id="help"></button>
<nav id="nav"></nav>

<script>
/* ===== Telegram ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const BOT = "tajikdonatbot";
const PAY_NUMBER = "062455959";
const PAY_LINK = "http://pay.expresspay.tj/?A=9762000287017734&s=&c=&f1=133&FIELD2=&FIELD3=";
const UPLOAD_URL = ""; // суроғаи сервер барои қабули чек (баъд аз сохтани сервер пур мекунем)
const TERMS = "Баланс баъд аз тасдиқи пардохт аз тарафи админ зиёд мешавад. Чекро ба бот фиристед."; // худатон иваз кунед

/* ===== Нишонаҳо ===== */
const P = {
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  game:'<path d="M6 12h4M8 10v4"/><circle cx="15" cy="13" r=".5"/><circle cx="18" cy="11" r=".5"/><rect x="2" y="6" width="20" height="12" rx="4"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  shop:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  orders:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  right:'<path d="m9 18 6-6-6-6"/>', left:'<path d="m15 18-6-6 6-6"/>',
  help:'<path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', out:'<path d="M7 17 17 7M7 7h10v10"/>', card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ===== Маълумот (нархҳо — намуна, худатон иваз кунед) ===== */
const GAMES = [
  {id:"ff-cis", idKey:"ff", name:"Free Fire СНГ", icon:"🔥", g1:"#e3283f", g2:"#6d0a1b", cat:"games", items:[
    ["110 алмаз",7.89],["341 алмаз",23.5],["572 алмаз",39.39],["1166 алмаз",78],["2398 алмаз",155.5],["6160 алмаз",395],["Weekly Lite",3.9],["Ваучер ҳафта",14.9]]},
  {id:"ff-id", idKey:"ff", name:"Free Fire Индонезия", icon:"🔥", g1:"#f0603a", g2:"#8f0b21", cat:"games", items:[
    ["50 алмаз",5],["70 алмаз",7],["140 алмаз",14],["355 алмаз",28],["720 алмаз",54],["1450 алмаз",110]]},
  {id:"pubg", idKey:"pubg", name:"PUBG Mobile", icon:"🎯", g1:"#5a3a3f", g2:"#1d0b0e", cat:"games", items:[
    ["60 UC",8.8],["325 UC",44.3],["660 UC",87.87],["1800 UC",220.2],["3850 UC",442.5],["8100 UC",884.3]]},
  {id:"tg-prem", idKey:"tg", name:"Telegram Premium", icon:"⭐", g1:"#b3202a", g2:"#3b0a12", cat:"telegram", items:[
    ["3 моҳ",119.9],["6 моҳ",190],["12 моҳ",330]]},
  {id:"tg-stars", idKey:"tg", name:"Telegram Stars", icon:"🌟", g1:"#d97a1c", g2:"#6d0a1b", cat:"telegram", items:[
    ["50 Stars",7.5],["100 Stars",14.5],["500 Stars",70]]},
  {id:"steam", idKey:"steam", name:"Steam", icon:"🎮", g1:"#7a1228", g2:"#1d0509", cat:"games", items:[
    ["Steam $5",55],["Steam $10",108],["Steam $20",212]]}
];
const IDINFO = { ff: "Free Fire ID", pubg: "PUBG ID", tg: "Telegram @username", steam: "Steam логин" };
const CATS = [["all","Ҳама","home"],["games","Бозиҳо","game"],["telegram","Telegram","send"]];

/* ===== Ҳолат (дар телефон нигоҳ дошта мешавад — танҳо намоиш) ===== */
let S = { balance: 0, cart: [], orders: [], topups: [], theme: "light", ids: {} };
try { const raw = localStorage.getItem("shop_state"); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem("shop_state", JSON.stringify(S)); } catch (e) {} }

let view = "shop", cat = "all", query = "", gameId = null, topAmount = 50, termsOk = false, termsOpen = false, payAmount = 50, payEnd = 0, timerId = null;

/* ===== Ёвар ===== */
const $ = s => document.querySelector(s);
const money = n => n.toFixed(2).replace(".", ",") + " см";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cartTotal = () => S.cart.reduce((a, i) => a + i.price * i.qty, 0);
const cartKeys = () => [...new Set(S.cart.map(c => GAMES.find(g => g.id === c.gid).idKey))];
const cartCount = () => S.cart.reduce((a, i) => a + i.qty, 0);
const refLink = () => `https://t.me/${BOT}?start=ref_${tgUser ? tgUser.id : "0"}`;
const nowStr = () => new Date().toLocaleString("ru-RU").slice(0, 17);
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function applyTheme() { document.documentElement.setAttribute("data-theme", S.theme); }
function toggleTheme() { S.theme = S.theme === "dark" ? "light" : "dark"; save(); applyTheme(); render(); }
function go(v, extra) {
  view = v; if (extra !== undefined) gameId = extra;
  if (timerId) { clearInterval(timerId); timerId = null; }
  render(); window.scrollTo(0, 0);
  if (v === "pay") { tick(); timerId = setInterval(tick, 1000); }
}
function tick() {
  const el = $("#timer"); if (!el) return;
  const left = Math.max(0, Math.floor((payEnd - Date.now()) / 1000));
  el.textContent = left ? `Дар давоми ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "Вақт тамом шуд";
}
function copyText(t, msg) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast(msg), () => toast(t)); else toast(t);
}
function openTg(url) { if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank"); }
function openPay() { if (tg && tg.openLink) tg.openLink(PAY_LINK); else window.open(PAY_LINK, "_blank"); }

/* ===== Амалҳо ===== */
function addToCart(gid, idx) {
  const g = GAMES.find(x => x.id === gid), it = g.items[idx];
  const found = S.cart.find(c => c.gid === gid && c.idx === idx);
  if (found) found.qty++; else S.cart.push({ gid, idx, game: g.name, name: it[0], price: it[1], qty: 1 });
  save(); renderCartBar(); toast("Ба сабад илова шуд");
}
function changeQty(i, d) { S.cart[i].qty += d; if (S.cart[i].qty <= 0) S.cart.splice(i, 1); save(); render(); }
function checkout() {
  const keys = cartKeys(), ids = {};
  for (const k of keys) { const v = ($("#pid-" + k).value || "").trim(); if (!v) return toast("Ворид кунед: " + IDINFO[k]); ids[k] = v; }
  const total = cartTotal();
  if (total > S.balance) return toast("Баланс кофӣ нест. Аввал пур кунед.");
  S.balance -= total; S.ids = Object.assign(S.ids || {}, ids);
  const pid = keys.map(k => `${IDINFO[k]}: ${ids[k]}`).join("; ");
  S.orders.unshift({ id: "ORD-" + Math.floor(10000 + Math.random() * 89999), date: nowStr(), pid,
    items: S.cart.map(c => `${c.game} — ${c.name} ×${c.qty}`), total, status: "Интизорӣ" });
  S.cart = []; save(); toast("Фармоиш қабул шуд"); go("orders");
}
function setAmount(v) { topAmount = v; const b = $("#paybtn"); if (b) b.textContent = `Пур кардан · ${v} см`; }
function startPay() {
  const v = parseFloat(String($("#amount").value).replace(",", "."));
  if (!v || v <= 0) return toast("Маблағро дуруст ворид кунед");
  if (!termsOk) return toast("Шартҳои хизматрасониро қабул кунед");
  checkFile = null; payAmount = v; payEnd = Date.now() + 10 * 60 * 1000; go("pay");
}
function sendCheck() { openTg(`https://t.me/${BOT}?start=check_${payAmount}`); }
let checkFile = null;
function pickCheck(inp) {
  checkFile = (inp.files && inp.files[0]) || null;
  const n = $("#fname"); if (n) n.textContent = checkFile ? checkFile.name : "";
}
async function payDone() {
  if (!UPLOAD_URL) { toast("Чекро дар чати бот фиристед"); return sendCheck(); }
  if (!checkFile) return toast("Аввал чекро интихоб кунед");
  const fd = new FormData();
  fd.append("amount", payAmount); fd.append("initData", tg ? tg.initData : ""); fd.append("check", checkFile);
  toast("Чек фиристода истодааст...");
  try { const r = await fetch(UPLOAD_URL, { method: "POST", body: fd }); if (!r.ok) throw new Error(r.status); }
  catch (e) { return toast("Чек фиристода нашуд. Боз кӯшиш кунед."); }
  S.topups.unshift({ id: "TOP-" + Math.floor(10000 + Math.random() * 89999), date: nowStr(), amount: payAmount, status: "Интизорӣ" });
  checkFile = null; save(); toast("Чек фиристода шуд. Админ тасдиқ мекунад."); go("history");
}

/* ===== Намоишҳо ===== */
function filtered() { return GAMES.filter(g => (cat === "all" || g.cat === cat) && g.name.toLowerCase().includes(query.toLowerCase())); }
function gridHTML(list) {
  if (!list.length) return `<div class="card muted" style="grid-column:1/-1">Чизе ёфт нашуд.</div>`;
  return list.map(g => `<button class="game" style="--g1:${g.g1};--g2:${g.g2}" onclick="go('game','${g.id}')"><div class="big">${g.icon}</div>
    <div><b>${esc(g.name)}</b><div class="sub"><span>аз ${money(Math.min(...g.items.map(i => i[1])))}</span>${ic("right", 18)}</div></div></button>`).join("");
}
function renderGrid() { $("#grid").innerHTML = gridHTML(filtered()); }
const topBar = () => `<div class="top"><div class="logo">TD</div><div class="brand">Taj <b>Donat</b></div><div class="circle">${ic("bell", 20)}</div></div>`;
const backBtn = to => `<button class="back" onclick="go('${to}')">${ic("left", 20)} Бозгашт</button>`;
const sec = (title, rows) => `<h2>${title}</h2><div class="card list">${rows}</div>`;
const rowBtn = (icon, label, val, act) => `<button class="item" onclick="${act}"><span class="ico">${ic(icon, 22)}</span><span class="grow">${label}</span><span class="val">${val || ""}</span>${ic("right", 18)}</button>`;

const V = {
  shop() {
    return `${topBar()}
      <div class="banner"><div class="row"><div><small>Балансатон</small><strong>${S.balance.toFixed(2).replace(".", ",")} <i>см</i></strong></div>
      <button class="pill" onclick="go('wallet')"><span>${ic("plus", 16)}</span>Пур кардан</button></div></div>
      <div class="row"><h2>Бозиҳо ва хидматҳо</h2><span class="muted">${GAMES.length}</span></div>
      <label class="search"><span>${ic("search", 20)}</span><input placeholder="Бозӣ ё молро ҷустуҷӯ кунед" value="${esc(query)}" oninput="query=this.value;renderGrid()"></label>
      <div class="chips">${CATS.map(c => `<button class="chip ${cat === c[0] ? "on" : ""}" onclick="cat='${c[0]}';render()">${ic(c[2], 18)}${c[1]}</button>`).join("")}</div>
      <div class="grid" id="grid">${gridHTML(filtered())}</div>`;
  },
  game() {
    const g = GAMES.find(x => x.id === gameId);
    return `${backBtn("shop")}<h1>${g.icon} ${esc(g.name)}</h1>
      <div class="grid">${g.items.map((it, i) => `<div class="pack"><div class="ic">${g.icon}</div><b>${esc(it[0])}</b><div class="pr">${money(it[1])}</div>
        <button class="btn sm" onclick="addToCart('${g.id}',${i})">Илова кардан +</button></div>`).join("")}</div>`;
  },
  cart() {
    if (!S.cart.length) return `${backBtn("shop")}<div class="card muted">Сабад холӣ аст.</div>`;
    return `${backBtn("shop")}<h1>Сабад</h1>
      ${S.cart.map((c, i) => `<div class="card row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.game)} · ${money(c.price)}</div></div>
        <div class="row"><button class="circle" onclick="changeQty(${i},-1)">−</button><b>${c.qty}</b><button class="circle" onclick="changeQty(${i},1)">+</button></div></div>`).join("")}
      <div class="card">${cartKeys().map(k => `<label class="muted" for="pid-${k}">${IDINFO[k]}</label>
        <div class="field"><input id="pid-${k}" value="${esc((S.ids || {})[k] || "")}" onchange="S.ids['${k}']=this.value.trim();save()" style="font-size:22px"></div>`).join("")}
        <div class="row"><span>Ҷамъ:</span><b>${money(cartTotal())}</b></div>
        <div class="row muted"><span>Балансатон:</span><span>${money(S.balance)}</span></div></div>
      <button class="btn" onclick="checkout()">Харидан — ${money(cartTotal())}</button>`;
  },
  orders() {
    return `<h1>Фармоишҳо</h1>` + (S.orders.length ? S.orders.map(o => `<div class="card"><div class="row"><b>${o.id}</b><span class="tag">${o.status}</span></div>
      <div class="muted">${o.date} · ID: ${esc(o.pid)}</div>${o.items.map(t => `<div>${esc(t)}</div>`).join("")}<div style="margin-top:6px"><b>${money(o.total)}</b></div></div>`).join("")
      : `<div class="card muted">Ҳоло фармоиш нест.</div>`);
  },
  bonus() {
    return `<h1>Бонус</h1><div class="card"><b>Дӯстонро даъват кунед</b><p class="muted" style="margin:6px 0 10px">Истиноди худро ба дӯстон фиристед.</p>
      <div class="card muted" style="word-break:break-all;background:var(--soft);box-shadow:none">${esc(refLink())}</div>
      <button class="btn" onclick="copyText(refLink(),'Истинод нусха шуд')">Нусха кардани истинод</button></div>`;
  },
  wallet() {
    return `<div class="row"><h1>Ҳамён</h1><button class="chip" onclick="go('history')">Таърих ${ic("right", 16)}</button></div>
      <div class="wcard"><div><b style="font-size:18px">Taj Donat</b><div class="chipic"></div></div>
        <div><small>БАЛАНС</small><strong>${S.balance.toFixed(2).replace(".", ",")} <i>см</i></strong></div><small>TAJ DONAT WALLET</small></div>
      <div class="card" style="margin-top:16px"><b style="font-size:19px">Маблағи пуркунӣ</b>
        <div class="field"><input id="amount" inputmode="decimal" value="${topAmount}" oninput="setAmount(parseFloat(this.value.replace(',','.'))||0)"><b class="muted">см</b></div>
        <div class="amounts">${[20, 50, 100, 200, 500].map(a => `<button class="${topAmount === a ? "on" : ""}" onclick="topAmount=${a};render()">${a}</button>`).join("")}</div>
        <button class="chip" style="margin-top:14px;color:var(--accent)" onclick="termsOpen=!termsOpen;render()">Шартҳо ▾</button>
        ${termsOpen ? `<p class="muted" style="margin-top:8px">${esc(TERMS)}</p>` : ""}
        <label class="check"><input type="checkbox" ${termsOk ? "checked" : ""} onchange="termsOk=this.checked"><span>Шартҳои хизматрасониро қабул мекунам</span></label>
        <button class="btn" id="paybtn" onclick="startPay()">Пур кардан · ${topAmount} см</button></div>`;
  },
  pay() {
    return `${backBtn("wallet")}
      <div class="card"><div class="row"><b style="font-size:19px">Душанбе Сити</b><span class="tag" id="timer"></span></div>
        <p class="muted" style="text-align:center;margin-top:14px">Маҳз интиқол диҳед</p>
        <div class="row" style="justify-content:center;gap:12px;margin:8px 0"><b style="font-size:38px;color:var(--accent)">${payAmount.toFixed(2)} TJS</b>
          <button class="circle" onclick="copyText('${payAmount.toFixed(2)}','Маблағ нусха шуд')" aria-label="Нусха">${ic("copy", 20)}</button></div>
        <button class="btn dark" onclick="openPay()"><span><b style="font-size:19px;display:block">Пардохт кардан</b><span style="font-size:14px;opacity:.85">Истиноди пардохт кушода мешавад</span></span>${ic("out", 22)}</button>
        <div class="row card" style="margin:12px 0 0;box-shadow:none;background:var(--soft)"><span><span class="muted">Ё ба рақами DC:</span><br><b style="font-size:20px">${PAY_NUMBER}</b></span>
          <button class="circle" onclick="copyText(PAY_NUMBER,'Рақам нусха шуд')" aria-label="Нусха">${ic("copy", 20)}</button></div>
        <ol class="steps"><li>Пулро бо истинод ё ба рақами боло фиристед.</li><li>Интиқолро дар барнома тасдиқ кунед.</li><li>Ба ин ҷо баргашта, чекро фиристед ва «Ман пардохт кардам»-ро пахш кунед.</li></ol></div>
      <div class="card"><b style="font-size:19px">Аллакай пардохтед?</b><p class="muted" style="margin:6px 0 12px">Скриншоти чекро интихоб кунед ва «Ман пардохт кардам»-ро пахш кунед.</p>
        <label class="drop"><span>${ic("plus", 22)}</span><span style="background:none;width:auto;height:auto;display:block;color:inherit"><b>Чекро аз файл интихоб кунед</b><br><small class="muted" id="fname"></small></span><input type="file" accept="image/*,application/pdf" hidden onchange="pickCheck(this)"></label>
        <button class="btn" style="margin-top:12px" onclick="payDone()">Ман пардохт кардам</button></div>
      <button class="btn out" onclick="go('wallet')">Бекор кардан</button>`;
  },
  history() {
    return `${backBtn("wallet")}<h1>Таърихи баланс</h1>` + (S.topups.length ? S.topups.map(t => `<div class="card row"><div><b>${t.id}</b><div class="muted">${t.date}</div></div>
      <div style="text-align:right"><b>${money(t.amount)}</b><br><span class="tag">${t.status}</span></div></div>`).join("") : `<div class="card muted">Ҳоло пуркунӣ нест.</div>`);
  },
  profile() {
    const name = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "Меҳмон";
    const av = tgUser && tgUser.photo_url ? `<img src="${esc(tgUser.photo_url)}" alt="">` : esc((name[0] || "?").toUpperCase());
    return `<h1>Профил</h1>
      <div class="card row"><div class="row" style="justify-content:flex-start;gap:14px"><div class="avatar">${av}</div>
        <div><b style="font-size:18px">${esc(name)}</b><div class="muted">${tgUser && tgUser.username ? "@" + esc(tgUser.username) : ""}</div>
        ${tgUser && tgUser.is_premium ? `<span class="badge">👑 Premium</span>` : ""}</div></div></div>
      ${sec("Ҳисоб", rowBtn("card", "Рақами мизоҷ", tgUser ? "№ " + tgUser.id : "—", "copyText('" + (tgUser ? tgUser.id : "") + "','Рақам нусха шуд')")
        + rowBtn("orders", "Фармоишҳои ман", S.orders.length, "go('orders')") + rowBtn("clock", "Таърихи баланс", "", "go('history')") + rowBtn("gift", "Дӯстонро даъват кунед", "", "go('bonus')"))}
      <h2>Профили бозӣ</h2><div class="card list">${Object.keys(IDINFO).map(k => `<div class="item"><span class="ico">${ic("game", 22)}</span><div class="grow"><div class="val">${IDINFO[k]}</div>
        <input class="idin" value="${esc((S.ids || {})[k] || "")}" placeholder="Ворид кунед" onchange="S.ids['${k}']=this.value.trim();save();toast('Нигоҳ дошта шуд')"></div></div>`).join("")}</div>
      ${sec("Танзимот", rowBtn("globe", "Забон", "Тоҷикӣ", "toast('Ҳоло танҳо тоҷикӣ')") + rowBtn("moon", "Мавзӯъ", S.theme === "dark" ? "Торик" : "Равшан", "toggleTheme()"))}
      ${sec("Дастгирӣ", rowBtn("help", "Ба дастгирӣ нависед", "", "openTg('https://t.me/'+BOT)"))}`;
  }
};
function renderCartBar() {
  const n = cartCount();
  $("#cartbar").innerHTML = (n && view !== "cart" && view !== "pay") ? `<button class="btn" onclick="go('cart')">Сабад (${n}) — ${money(cartTotal())}</button>` : "";
}
function renderNav() {
  const items = [["shop", "shop", "Мағоза"], ["orders", "orders", "Фармоишҳо"], ["bonus", "gift", "Бонус"], ["wallet", "wallet", "Ҳамён"], ["profile", "user", "Профил"]];
  const active = { game: "shop", cart: "shop", pay: "wallet", history: "wallet" }[view] || view;
  $("#nav").innerHTML = items.map(i => `<button class="${active === i[0] ? "on" : ""}" onclick="go('${i[0]}')">${ic(i[1], 24)}${i[2]}</button>`).join("");
}
function render() { $("#app").innerHTML = V[view](); renderCartBar(); renderNav(); $("#help").innerHTML = ic("help", 26); }
applyTheme();
render();
</script>
</body>
</html>
